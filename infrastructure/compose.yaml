services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: msrn
      POSTGRES_USER: msrn
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local environment}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - msrn_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msrn -d msrn"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  msrn_postgres:
